name: checks
on: [pull_request]
permissions: { contents: read }               # AM-025: least-privilege token
concurrency:                                   # AM-025: cancel superseded runs of the same ref
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30                        # AM-025
    steps:                                     # AM-067: every action is pinned to a full commit SHA (AM-040 pattern)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }   # AM-025: nothing downstream needs git auth
      - name: Setup Bun                        # AM-069: no job restores or saves the Bun executable in the Actions cache
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version, no-cache: true }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (biome check)
        run: bun run lint
      - name: Build packages                   # AM-029: two-phase (packages, then apps)
        run: bun run build
      - name: Typecheck                        # AM-025: after build — needs line-schemas dist/*.d.ts
        run: bun --filter '@websublime/*' typecheck
      - name: Pack verification (AM-036)
        run: bun run scripts/verify-pack.mjs    # after build — packs every publishable package offline and checks the tarballs
      - name: Size report                      # Phase 1 spec §7.6: gates nothing (SD21); the script always exits 0
        run: bun run scripts/report-size.mjs
      - name: Layer lint (downward-only enforcement)
        run: bun run scripts/lint-layers.mjs
      - name: Palette freshness
        run: bun run scripts/verify-palettes-fresh.mjs
      - name: Contrast validation
        run: bun run scripts/validate-contrast.mjs
      - name: F2 preload-presence assertion (AM-018)  # AM-025: anchored and escaped
        run: grep -qE '^preload = \["\./bun-test-preload\.ts"\]$' bunfig.toml
      - name: Unit tier
        run: bun test
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Browser tier
        run: bun run e2e
      - name: Storybook build
        run: bun --filter '@websublime/line-storybook' build
