name: release-records
on:                                            # AM-114: a fork PR's status comes from the issue_comment run
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
permissions: {}                                # the job declares its own
concurrency:                                   # AM-114: runs of one PR never overlap; the last run to start evaluates last
  group: release-records-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  evaluate:                                    # AM-114: never named release-records, so its check run cannot satisfy the status
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:                               # AM-114
      contents: read                           # the main checkout, branches/main and package.json through the contents API
      actions: read                            # the cited runs
      pull-requests: read                      # the PR and its comments
      statuses: write                          # the release-records status on the PR head sha
    steps:                                     # every action is pinned to a full commit SHA, as in checks.yml
      - name: Checkout main                    # AM-114: the script from main, never PR content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: scripts
          persist-credentials: false
      - name: Setup Bun                        # AM-069: no job restores or saves the Bun executable in the Actions cache
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version, no-cache: true }
      - name: Report the release-records status
        run: bun run scripts/release-records.mjs  # no install: the script imports nothing
        env:                                   # AM-114: event data only through env, never inside run
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
