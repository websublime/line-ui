name: cdn-check
run-name: cdn-check line-components@${{ inputs.line-components-version }}  # AM-114: release-records reads the tested version from display_title
on:                                            # 01-C22: CDN-backed specs run on demand, never on pull_request
  workflow_dispatch:
    inputs:                                    # AM-105, AM-106: exact versions to test; empty = resolved by cdn.e2e.ts
      line-components-version:
        description: 'Exact @websublime/line-components version to test; empty = resolve the npm canary dist-tag'
        type: string
        required: false
        default: ''
      line-core-version:
        description: 'Exact @websublime/line-core version to test; empty = the version the line-components jsDelivr +esm bundles import'
        type: string
        required: false
        default: ''
permissions: { contents: read }
jobs:
  cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:                                     # every action is pinned to a full commit SHA, as in checks.yml
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version, no-cache: true }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: CDN tier
        run: bunx playwright test cdn.e2e
        env:                                   # AM-105: inputs reach the test only through env, never inside run
          LINE_E2E_CDN: '1'
          LINE_CDN_COMPONENTS_VERSION: ${{ inputs.line-components-version }}
          LINE_CDN_CORE_VERSION: ${{ inputs.line-core-version }}
