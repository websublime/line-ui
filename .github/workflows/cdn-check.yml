name: cdn-check
on: [workflow_dispatch]                        # 01-C22: CDN-backed specs run on demand, never on pull_request
permissions: { contents: read }
jobs:
  cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:                                     # every action is pinned to a full commit SHA, as in checks.yml
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version, no-cache: true }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: CDN tier
        run: bunx playwright test cdn.e2e
        env: { LINE_E2E_CDN: '1' }
