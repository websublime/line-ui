# Project-scoped omp settings for line-ui (merged over ~/.omp/agent/config.yml).
# The main session keeps the model the developer selects; the gate and research
# subagents always run on Opus through the native Anthropic provider (no
# OpenRouter `~` alias). Repo agents under .claude/agents/ carry their own
# `model:` in frontmatter for Claude Code.
task:
  agentModelOverrides:
    reviewer: "anthropic/claude-opus-5-5:high"
    security-reviewer: "anthropic/claude-opus-5-5:high"
    scout: "anthropic/claude-opus-5-5:high"
    sonic: "anthropic/claude-opus-5-5:high"
