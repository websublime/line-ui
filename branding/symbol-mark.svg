<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- :// symbol mark -->
  <!-- Colon: two dots = connection nodes -->
  <circle cx="14" cy="20" r="5" fill="#c8ff00"/>
  <circle cx="14" cy="44" r="5" fill="#c8ff00"/>
  <!-- Forward slashes = path forward -->
  <line x1="28" y1="52" x2="42" y2="12" stroke="#E8E8E8" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="52" x2="56" y2="12" stroke="#E8E8E8" stroke-width="5" stroke-linecap="round"/>
</svg>
